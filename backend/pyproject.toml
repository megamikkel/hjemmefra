[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hjemmefra"
version = "0.1.0"
description = "Deterministic meal-plan and grocery optimization backend for Danish households"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "ortools>=9.8",
  "structlog>=23.0",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hjemmefra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
