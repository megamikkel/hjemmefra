name: Fetch source data

# Runs where outbound network exists. Fetches official-API offers (if secrets are set) and
# schema.org recipe facts, then commits raw files to the `data` branch. Recipe fetching
# honours robots.txt and Crawl-delay, is rate limited and capped per run, and is incremental:
# recipes already on the data branch are not fetched again. Method text is not stored.
on:
  workflow_dispatch:
    inputs:
      zip:
        description: Postal code to fetch offers for
        default: "4200"
      max_new_recipes:
        description: Max new recipe pages to fetch this run
        default: "150"
  schedule:
    - cron: "17 5 * * 1,4"  # Monday and Thursday mornings UTC

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ./backend
      - name: Restore previously fetched recipes
        run: |
          mkdir -p fetched/recipes
          if git fetch origin data 2>/dev/null; then
            git archive origin/data fetched/recipes 2>/dev/null | tar -x -C . 2>/dev/null || true
          fi
          echo "existing recipes: $(ls fetched/recipes | wc -l)"
      - name: Fetch
        env:
          HJEMMEFRA_SALLING_API_TOKEN: ${{ secrets.HJEMMEFRA_SALLING_API_TOKEN }}
          HJEMMEFRA_TJEK_API_KEY: ${{ secrets.HJEMMEFRA_TJEK_API_KEY }}
        run: |
          python -m hjemmefra.tools.fetch_sources --out fetched --zip "${{ github.event.inputs.zip || '4200' }}" \
            --recipe-urls data/recipe_sources.txt \
            --discover-sitemap https://www.valdemarsro.dk \
            --max-new-recipes "${{ github.event.inputs.max_new_recipes || '150' }}" --delay 2
          echo "recipes now: $(ls fetched/recipes | wc -l)"
      - name: Commit to data branch
        run: |
          git config user.name "hjemmefra-data-bot"
          git config user.email "noreply@example.invalid"
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git worktree add -B data out origin/data
          else
            git worktree add --orphan -b data out
          fi
          mkdir -p out/fetched && rm -rf out/fetched/* && cp -r fetched/. out/fetched/
          cd out && git add -A fetched && (git commit -m "Fetch source data $(date -u +%FT%TZ)" || echo "no changes") && git push -u origin data
